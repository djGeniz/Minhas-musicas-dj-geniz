<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso DJGENIZ5744</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .caixa-login {
            background: #1a1a1a;
            padding: 35px 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 0 35px rgba(255, 120, 0, 0.5);
            text-align: center;
            border: 2px solid #ff9900;
        }

        .logo {
            max-width: 350px;
            margin-bottom: 10px;
        }

        .foto-perfil {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffcc00;
            margin-bottom: 20px;
        }

        .caixa-login h2 {
            color: #ffcc00;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .campo {
            margin-bottom: 22px;
            text-align: left;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            color: #ffcc00;
            font-weight: bold;
            font-size: 15px;
        }

        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ff6600;
            border-radius: 8px;
            font-size: 16px;
            background: #2b2b2b;
            color: white;
            outline: none;
        }

        .campo input:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff4400, #ffcc00);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
        }

        #conteudo {
            display: none;
            color: #ffcc00;
            text-align: center;
            padding: 40px 20px;
            width: 100%;
        }

        #conteudo h1 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        #conteudo p {
            font-size: 18px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="caixa-login" id="telaLogin">
        <img src="logo.png" alt="DJ GENIZ - O Chegado da Galera" class="logo">
        <img src="foto.png" alt="DJGENIZ5744" class="foto-perfil">

        <h2>Acesso Restrito</h2>
        
        <div class="campo">
            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <button onclick="entrar()">Entrar</button>
    </div>

    <!-- AQUI VOCÊ COLOCA TODO O SEU SITE, MÚSICAS, LINKS, TUDO O QUE QUISER -->
    <div id="conteudo">
        <h1>🎧 Bem-vindo ao espaço do DJ GENIZ!</h1>
        <p>Aqui você coloca suas músicas, links, agenda e tudo o que quiser compartilhar.</p>
    </div>

<script>
const usuarioCorreto = "DJGENIZ5744";
const senhaCorreta = "5744DJ@";

function entrar() {
    let user = document.getElementById("usuario").value;
    let pass = document.getElementById("senha").value;

    if(user === usuarioCorreto && pass === senhaCorreta) {
        document.getElementById("telaLogin").style.display = "none";
        document.getElementById("conteudo").style.display = "block";
    } else {
        alert("❌ Usuário ou senha incorretos! Tente novamente.");
    }
}
</script>

</body>
</html>
